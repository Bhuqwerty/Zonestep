name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.5"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  apk:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets are missing. Building a debug-signed APK as an artifact only; no release will be published."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=zonestep
          keyPassword=$KEYSTORE_PASSWORD
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/debug-symbols

      - name: Name, checksum and certificate fingerprint
        id: meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          NAME="zonestep-${VERSION}-build${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$NAME" | grep -i "SHA-256" | head -1 > cert.txt || true
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cat "$NAME.sha256" cert.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            ${{ steps.meta.outputs.name }}
            ${{ steps.meta.outputs.name }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-build${{ github.run_number }}
          path: build/debug-symbols
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && steps.signing.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.meta.outputs.version }}-build${{ github.run_number }}"
          {
            echo "Android build ${{ github.run_number }} from commit ${GITHUB_SHA::7}."
            echo
            echo "Install: download the APK on your phone, open it, and allow your browser to install unknown apps when asked."
            echo
            echo "SHA-256 of the APK: \`$(cut -d' ' -f1 "${{ steps.meta.outputs.name }}.sha256")\`"
            echo
            echo "Signing certificate: \`$(sed 's/.*: //' cert.txt)\`"
            echo
            echo "### Changes"
            git log -1 --pretty=format:'%s%n%n%b' | sed '/^Co-Authored-By/d;/^Claude-Session/d'
          } > notes.md
          gh release create "$TAG" \
            "${{ steps.meta.outputs.name }}" "${{ steps.meta.outputs.name }}.sha256" \
            --title "Zonestep ${{ steps.meta.outputs.version }} (build ${{ github.run_number }})" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
